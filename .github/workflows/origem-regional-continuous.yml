name: ORIGEM Regional Continuous Gate

on:
  push:
    branches:
      - integration/r1-r6-sprint1
      - feature/dev2-r2-river-road
      - dev2/r2-river-road
      - dev3/r3-arch-ruins
      - dev4/r4-dense-forest
      - dev5/r5-majestic-camp
      - dev6/r6-submerged-ruins
  pull_request:
    branches:
      - integration/r1-r6-sprint1
  workflow_dispatch:
    inputs:
      region:
        description: Região a validar (ALL para validar R2–R6)
        required: true
        default: ALL
        type: choice
        options:
          - ALL
          - R2
          - R3
          - R4
          - R5
          - R6

permissions:
  contents: read
  issues: write

concurrency:
  group: origem-regional-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-regions:
    name: Determinar regiões afetadas
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.region.outputs.regions }}
    steps:
      - id: region
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            requested="${{ inputs.region }}"
          else
            requested="${{ github.head_ref || github.ref_name }}"
          fi
          case "$requested" in
            feature/dev2-r2-river-road|dev2/r2-river-road) regions='["R2"]' ;;
            dev3/r3-arch-ruins) regions='["R3"]' ;;
            dev4/r4-dense-forest) regions='["R4"]' ;;
            dev5/r5-majestic-camp) regions='["R5"]' ;;
            dev6/r6-submerged-ruins) regions='["R6"]' ;;
            R2|R3|R4|R5|R6) regions="[\"$requested\"]" ;;
            *) regions='["R2","R3","R4","R5","R6"]' ;;
          esac
          echo "regions=$regions" >> "$GITHUB_OUTPUT"

  regional-gate:
    name: Porta regional ${{ matrix.region }}
    needs: resolve-regions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.resolve-regions.outputs.regions) }}
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION=4.7.1
          GODOT_DIR="$RUNNER_TEMP/godot"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$GODOT_DIR/godot.zip"
          unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
          chmod +x "$GODOT_DIR"/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "$GODOT_DIR" >> "$GITHUB_PATH"

      - name: Executar parser, contratos e rotas
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7.1-stable_linux.x86_64
        shell: bash
        run: tools/qa/run_regional_gate.sh "${{ matrix.region }}" HEAD

      - name: Guardar evidências de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: origem-${{ matrix.region }}-qa-logs
          path: /tmp/origem_${{ matrix.region }}_*.log
          if-no-files-found: warn
          retention-days: 14

  global-light-budget:
    name: Orçamento global de luz
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Instalar Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION=4.7.1
          GODOT_DIR="$RUNNER_TEMP/godot"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$GODOT_DIR/godot.zip"
          unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
          chmod +x "$GODOT_DIR"/Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Auditar luzes simultâneas
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7.1-stable_linux.x86_64
          OUT_DIR: ${{ runner.temp }}/origem_light_budget
        shell: bash
        run: tools/qa/run_light_budget_audit.sh

      - name: Guardar evidências de orçamento
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: origem-global-light-budget-logs
          path: ${{ runner.temp }}/origem_light_budget/**/*.log
          if-no-files-found: warn
          retention-days: 14

  dev2-continuity:
    name: Dev2 — próxima tarefa ativa
    needs: [resolve-regions, regional-gate, global-light-budget]
    if: >-
      needs.regional-gate.result == 'success' &&
      needs.global-light-budget.result == 'success' &&
      contains(needs.resolve-regions.outputs.regions, 'R2')
    runs-on: ubuntu-latest
    steps:
      - name: Obter contrato contínuo do Dev2
        uses: actions/checkout@v7

      - name: Validar contrato e manter a tarefa rastreável
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const contractPath = 'diretor_orientacoes/DEV2_R2_CONTINUOUS_WORK.md';
            const contract = fs.readFileSync(contractPath, 'utf8');
            const state = /^status:\s*ACTIVE\s*$/m.test(contract);
            const taskId = (contract.match(/^task_id:\s*([^\s]+)\s*$/m) || [])[1];
            const owner = (contract.match(/^owner:\s*([^\s]+)\s*$/m) || [])[1];
            const branch = (contract.match(/^branch:\s*([^\s]+)\s*$/m) || [])[1];
            if (!state || !taskId || owner !== 'Dev2' || branch !== 'dev2/r2-river-road') {
              core.setFailed('Contrato Dev2 inválido: exige status ACTIVE, task_id, owner Dev2 e branch canónica.');
              return;
            }
            const title = `[Dev2 Continuous] ${taskId}`;
            const { owner: repoOwner, repo } = context.repo;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: repoOwner,
              repo,
              state: 'open',
              per_page: 100
            });
            let currentIssue = openIssues.find((issue) => issue.title === title && !issue.pull_request);
            if (!currentIssue) {
              const { data: createdIssue } = await github.rest.issues.create({
                owner: repoOwner,
                repo,
                title,
                body: `## Continuidade automática Dev2\n\nO contrato \`${contractPath}\` declara **${taskId}** como a próxima tarefa ativa de Dev2.\n\nA porta R2 acabou de ser aprovada. Isto não encerra o ciclo: a implementação, validação, publicação e substituição por uma nova tarefa ativa são obrigatórias.\n\n---\n\n${contract}`
              });
              currentIssue = createdIssue;
              core.info(`Issue de continuidade criada para ${taskId}.`);
            } else {
              core.info(`Issue de continuidade já está aberta: #${currentIssue.number}.`);
            }
            const previousIssues = openIssues.filter((issue) =>
              !issue.pull_request &&
              issue.title.startsWith('[Dev2 Continuous]') &&
              issue.number !== currentIssue.number
            );
            for (const issue of previousIssues) {
              await github.rest.issues.createComment({
                owner: repoOwner,
                repo,
                issue_number: issue.number,
                body: `Encerrada automaticamente: a tarefa ativa foi avançada para **${taskId}** e é acompanhada por #${currentIssue.number}.`
              });
              await github.rest.issues.update({
                owner: repoOwner,
                repo,
                issue_number: issue.number,
                state: 'closed'
              });
              core.info(`Issue Dev2 obsoleta encerrada: #${issue.number}.`);
            }
            await core.summary
              .addHeading('Dev2 — continuidade ativa')
              .addRaw(`Tarefa: **${taskId}**  \nBranch: \`${branch}\`  \nEstado: **ACTIVE**`)
              .write();

  regional-gate-summary:
    name: ORIGEM Regional Gate
    needs: [regional-gate, global-light-budget, dev2-continuity]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Exigir aprovação de todas as regiões selecionadas
        shell: bash
        run: |
          set -euo pipefail
          regional_result="${{ needs.regional-gate.result }}"
          lighting_result="${{ needs.global-light-budget.result }}"
          continuity_result="${{ needs.dev2-continuity.result }}"
          echo "Resultado regional: $regional_result"
          echo "Resultado de iluminação: $lighting_result"
          echo "Resultado de continuidade Dev2: $continuity_result"
          if [[ "$regional_result" != "success" || "$lighting_result" != "success" ]]; then
            echo "Uma porta regional ou a auditoria global de luz falhou ou foi cancelada." >&2
            exit 1
          fi
          if [[ "$continuity_result" != "success" && "$continuity_result" != "skipped" ]]; then
            echo "A continuidade ativa do Dev2 não foi confirmada." >&2
            exit 1
          fi
          echo "Todas as regiões selecionadas, o orçamento global de luz e a continuidade aplicável foram aprovados."
